<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Monitor (Source) -->
  <rect x="10" y="12" width="30" height="22" rx="3" fill="none" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="25" y1="34" x2="25" y2="40" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="40" x2="32" y2="40" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tablet (Second Screen Sink) -->
  <rect x="28" y="24" width="26" height="28" rx="4" fill="#1E293B" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <!-- Tablet screen content -->
  <rect x="32" y="28" width="18" height="20" rx="2" fill="url(#accentGrad)" opacity="0.3"/>
  <circle cx="41" cy="49" r="1.5" fill="#38BDF8"/>

  <!-- Wireless / Cast Waves -->
  <path d="M 22 22 A 6 6 0 0 1 26 26" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 19 19 A 11 11 0 0 1 27 27" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
